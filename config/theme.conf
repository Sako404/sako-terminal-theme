# SAKO Terminal Theme — canonical settings (Single Source of Truth)
#
# Every generated file (Starship, Fish, terminal colour schemes) is rendered
# from this file. Do not edit generated files by hand.
#
# To personalise without touching the repository, copy any key into
#   ~/.config/sako-terminal-theme/local.conf
# and re-run ./install.sh. Keys in local.conf override the values below.
#
# Format: KEY=value, one per line. Values may be wrapped in "double" or
# 'single' quotes. No inline comments (colours contain '#').
# This file is parsed, never executed.

# --- Branding (prompt line 1) ----------------------------------------------
SAKO_URL=https://marcinsakowski.com
SAKO_SLOGAN=Build • Automate • Solve
# strftime format of the clock at the end of line 1 (%T = HH:MM:SS)
SAKO_TIME_FORMAT=%T

# --- Prompt palette ----------------------------------------------------------
SAKO_NAVY=#0D567A
SAKO_CYAN=#00A6C8
SAKO_GREY=#94A3B8
SAKO_GIT_ORANGE=#FCA17D
SAKO_WHITE=#FFFFFF
SAKO_BACKGROUND=#0B1118
# Text on the navy username segment
SAKO_USER_FG=#FFFFFF
# Text on the cyan directory segment. White on #00A6C8 is only 2.9:1 contrast,
# #0B1118 gives 6.6:1 (WCAG AA). Set to #FFFFFF to get the pre-1.0 look back.
SAKO_DIR_FG=#0B1118

# --- Fish --------------------------------------------------------------------
SAKO_FISH_AUTOSUGGESTION=#7F8C9A

# --- Terminal emulator palette ---------------------------------------------
# Taken from the original KDE Konsole scheme (MS-Soft-Dark) on CachyOS.
# Bright colours (8-15) were not defined there; Konsole fell back to its
# saturated defaults. They are defined here so every emulator looks the same.
SAKO_TERM_BG=#141B24
SAKO_TERM_BG_INTENSE=#1C2430
SAKO_TERM_FG=#C5D1DE
SAKO_TERM_FG_INTENSE=#ECEFF1
SAKO_TERM_CURSOR=#00A6C8
SAKO_TERM_SELECTION_BG=#0D567A
SAKO_TERM_SELECTION_FG=#FFFFFF
SAKO_COLOR0=#1C2430
SAKO_COLOR1=#E57373
SAKO_COLOR2=#81C784
SAKO_COLOR3=#FFD54F
SAKO_COLOR4=#00A6C8
SAKO_COLOR5=#BA68C8
SAKO_COLOR6=#4DD0E1
SAKO_COLOR7=#CFD8DC
SAKO_COLOR8=#64748B
SAKO_COLOR9=#EF9A9A
SAKO_COLOR10=#A5D6A7
SAKO_COLOR11=#FFE082
SAKO_COLOR12=#4FC3F7
SAKO_COLOR13=#CE93D8
SAKO_COLOR14=#80DEEA
SAKO_COLOR15=#FFFFFF

# --- Font ----------------------------------------------------------------------
# JetBrains Mono Nerd Font, "NL" = no ligatures (what Konsole used originally).
SAKO_FONT_FAMILY=JetBrainsMonoNL Nerd Font
SAKO_FONT_SIZE=11
